<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TabMergerAI Archive</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    main { max-width: 860px; margin: 28px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
    #search { flex: 1; min-width: 0; }
    .entry { display: flex; flex-direction: column; gap: 8px; }
    .entry h2 { font-size: 15px; margin: 0; }
    .entry p { margin: 0; }
    .entry ul.points { margin: 0; padding-left: 18px; }
    .links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .links li { display: flex; gap: 6px; }
    .links .muted { margin-left: 4px; }
    details summary { cursor: pointer; color: var(--muted); }
    #empty { text-align: center; padding: 40px 0; }
    #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); }
  </style>
</head>
<body>
  <main>
    <div class="row">
      <h1>Archive</h1>
      <span id="count" class="muted small"></span>
      <span class="spacer"></span>
      <button id="copyAll">Copy all as Markdown</button>
    </div>
    <div class="row"><input type="search" id="search" placeholder="Search titles, summaries, URLs…"></div>
    <div id="list"></div>
    <p id="empty" class="muted" hidden>Nothing archived yet. Use "Summarize &amp; archive" in the popup.</p>
  </main>
  <div id="toast" class="banner" hidden></div>
  <script type="module" src="archive.js"></script>
</body>
</html>
